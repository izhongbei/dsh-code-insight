name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Installs the @deepseek-ai devDependencies the tests resolve the harness
      # packages from (no full DSH installation or extension checkout needed).
      - run: npm ci

      - name: Test
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run
