name: publish

# Tag-driven release: `npm version patch && git push --follow-tags`.
# Publishing needs a repository secret NPM_TOKEN: an npm Granular Access Token
# with "Bypass 2FA" enabled (npm requires 2FA or such a token to publish).
# Without the secret the npm step fails only when the version is not published
# yet; an existing version is skipped, so the tag still produces a GitHub
# Release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Publish to npm (skipped when this version already exists)
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "already published: ${NAME}@${VERSION}"
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            npm publish --access public
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1 }
            found && $0 ~ /^## \\[/ && $0 !~ "^## \\[" ver "\\]" { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists: $GITHUB_REF_NAME"
            exit 0
          fi
          if [ -s "$NOTES_FILE" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
